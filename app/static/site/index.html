<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gen Legend</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- style.css faces: the same Google Fonts the old shell linked, folded
       into ONE css2 request (19 stylesheet fetches → 1; each request is a
       render-blocking RTT on a phone) with display=swap so text paints
       before the webfonts land. The old shell linked Manufacturing Consent
       and UnifrakturMaguntia; nothing in the shipped assets names either
       family, so they went with the fold. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Beau+Rivage&family=Cinzel:ital@0;1&family=Cinzel+Decorative&family=Eagle+Lake&family=Fleur+De+Leah&family=IM+Fell+Double+Pica:ital@0;1&family=IM+Fell+Double+Pica+SC&family=IM+Fell+DW+Pica&family=IM+Fell+DW+Pica+SC&family=IM+Fell+English&family=IM+Fell+English+SC&family=IM+Fell+French+Canon+SC&family=IM+Fell+Great+Primer:ital@0;1&family=IM+Fell+Great+Primer+SC&family=Italianno&family=Spectral+SC:wght@400;600;700&family=Tangerine:wght@400;700&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=3">
  <!-- The static site's own chrome: it must come after style.css so its
       ties win — the legacy fallthrough keeps the light theme, this page
       is the dark slab house. -->
  <style>
  /* body is a column flexbox; only .main-wrap gets flex: 1 0 auto. The slab
     chrome must never shrink or header/footer collapse to 0 height (the
     legacy page fixed the same for <header>/<footer> in style.css). */
  gl-shell,
  gl-footer {
   flex: 0 0 auto;
  }

  /* Selector overlays hang below the card. Paint them above the legacy
     result, and while one is open grow the host box so native hit-testing
     (wheel + clicks on the lower rows) lands on gl-sheet, not the content
     behind it. */
  gl-sheet {
   position: relative;
   z-index: 999;
  }
  gl-sheet.selector-open {
   padding-bottom: 210px;
   margin-bottom: -210px;
  }

  html {
   background-color: #dcc49a;
   color: #2b1e12;
  }
  body {
   height: auto; /* style.css pins height:100% — that truncates the column
                    flex at the viewport and lets children overflow it */
   min-height: 100vh;
   min-height: 100dvh; /* phone toolbars: track the visible viewport */
   /* Stack its own background BELOW its negative-z children: without a
      context here, body's background paints in step 3 of the root context
      and covers <gl-parchment> (z:-2) entirely. */
   position: relative;
   z-index: 0;
   background-color: #cfb183;
   color: #2b1e12;
  }

  /* The papyrus sheet body is a slab component (app/slab/parchment.slab →
     <gl-parchment>): belly wash, procedural grain and age stains. Fixed full
     viewport behind all content and never hit-testable — a hit-testable
     backdrop would swallow every click on the page. */
  gl-parchment {
   position: fixed;
   inset: 0;
   z-index: -2;
   display: block;
   pointer-events: none;
  }

  /* The whole ground — strips, mottle, foxing, burns, vignette — is slab
     now (app/slab/parchment.slab → <gl-parchment>); app.js re-scatters its
     anchors per load. This <style> block keeps only legacy content
     overrides; no ruled CSS lines remain. */
  /* Welcome / tablet chrome is gone: <gl-forge> owns the whole home, and
     only owes it a generous width. */
  .forge-host {
   width: min(100%, 1040px);
   margin-top: 1rem;
  }

  /* The generated sheet is content written ON the papyrus:
     <gl-sheetbody> (app/slab/sheetbody.slab) paints its own ink, rules and
     padding, so the page only owes it a column and the gap under the
     reforge bar. */
  gl-sheetbody {
   display: block;
   margin-top: 1.25rem;
  }
  </style>
</head>
<body>
  <!-- The papyrus sheet body itself: procedural slab wash + grain
       (app/slab/parchment.slab → <gl-parchment>). Fixed full viewport behind all
       content; pointer-events:none so it can never eat a click. -->
  <gl-parchment></gl-parchment>

  <!-- The summon loader overlay (AtlasVenustas/Tools_of_Loader.py). -->
  <div id="loader" aria-live="polite" aria-busy="true">
    <div class="sol-layer"></div>
    <div class="orbit-layer orbit1"></div>
    <div class="orbit-layer orbit2"></div>
    <div class="orbit-layer orbit3"></div>
    <div id="loader-message">Summoning your legend...</div>
  </div>

  <!-- Page chrome in slab: header (app/slab/shell.slab → <gl-shell>).
       data-player-only="true" parks the NPC/DM navigation; the Player-only
       first publish ships with it parked. -->
  <gl-shell data-player-only="true"></gl-shell>

  <div class="main-wrap">
    <div class="container">

      <!-- Home: the slab hero + forge (app/slab/forge.slab → <gl-forge>).
           The component owns the headline, the flavour chips, the three
           pickers and the generate action; the page owes it a width. -->
      <section id="view-home" class="main-content">
        <div id="forge-host" class="forge-host">
          <gl-forge></gl-forge>
        </div>
      </section>

      <!-- Character Sheet: the slab reforge bar plus the slab sheet body
           (app/slab/sheetbody.slab), which app.js paints with params. -->
      <section id="view-sheet" hidden>
        <gl-sheet></gl-sheet>
        <gl-sheetbody></gl-sheetbody>
      </section>

    </div>
  </div>

  <!-- Page chrome in slab: footer (app/slab/footer.slab → <gl-footer>). -->
  <gl-footer></gl-footer>

  <script src="/static/js/summon-loader.js"></script>
  <script src="/static/js/eldritch.js"></script>
  <script type="module" src="/static/js/app.js?v=19"></script>
</body>
</html>
