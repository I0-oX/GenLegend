<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gen Legend</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- style.css faces: the same Google Fonts the old shell linked. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+Great+Primer:ital@0;1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+Great+Primer+SC">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica:ital@0;1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica+SC">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@400;600;700">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eagle+Lake">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italianno">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Beau+Rivage">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+SC">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia">
  <link rel="stylesheet" href="/static/style.css?v=2">
  <!-- The static site's own chrome: it must come after style.css so its
       ties win — the legacy fallthrough keeps the light theme, this page
       is the dark slab house. -->
  <style>
  /* body is a column flexbox; only .main-wrap gets flex: 1 0 auto. The slab
     chrome must never shrink or header/footer collapse to 0 height (the
     legacy page fixed the same for <header>/<footer> in style.css). */
  gl-shell,
  gl-footer {
   flex: 0 0 auto;
  }

  html {
   background-color: #e9d8b0;
   color: #2b1e12;
  }
  body {
   height: auto; /* style.css pins height:100% — that truncates the column
                    flex at the viewport and lets children overflow it */
   min-height: 100vh;
   /* Procedural papyrus: fiber weave + age blotches + a lit belly and
      darkened rim, all fixed to the viewport like a sheet on the table. */
   background-color: #e9d8b0;
   background-image:
    repeating-linear-gradient(92deg, rgba(139, 107, 54, 0.05) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(2deg, rgba(139, 107, 54, 0.04) 0 1px, transparent 1px 4px),
    radial-gradient(520px 260px at 14% 10%, rgba(184, 150, 90, 0.30), transparent 72%),
    radial-gradient(640px 380px at 86% 34%, rgba(160, 124, 64, 0.22), transparent 72%),
    radial-gradient(460px 460px at 46% 104%, rgba(146, 110, 52, 0.26), transparent 70%),
    radial-gradient(1100px 620px at 50% 26%, #f2e4c0 0%, #e9d8b0 56%, #ddc69c 100%),
    radial-gradient(closest-side at 50% 50%, transparent 62%, rgba(90, 64, 30, 0.34) 100%);
   background-attachment: fixed;
   color: #2b1e12;
  }

  /* Welcome / tablet chrome is gone: <gl-forge> owns the whole home, and
     only owes it a generous width. */
  .forge-host {
   width: min(100%, 1040px);
   margin-top: 1rem;
  }

  /* The generated sheet is content: a vellum card laid on the papyrus.
     The legacy result inherits colors — keep its own ink text so the light
     card doesn't pick up any stray color. */
  #character_result {
   background: #f5eed8;
   color: var(--text-color);
   border: 1px solid #a88f63;
   border-radius: 16px;
   box-shadow: 0 16px 40px rgba(74, 58, 31, 0.28);
   margin-top: 1.25rem;
   overflow: hidden;
   text-align: left;
  }
  #character_result .sheet {
   padding: 1.5rem 1.5rem 2rem;
   box-sizing: border-box;
  }
  </style>
</head>
<body>
  <!-- The summon loader overlay (AtlasVenustas/Tools_of_Loader.py). -->
  <div id="loader" aria-live="polite" aria-busy="true">
    <div class="sol-layer"></div>
    <div class="orbit-layer orbit1"></div>
    <div class="orbit-layer orbit2"></div>
    <div class="orbit-layer orbit3"></div>
    <div id="loader-message">Summoning your legend...</div>
  </div>

  <!-- Page chrome in slab: header (app/slab/shell.slab → <gl-shell>).
       data-player-only parks the NPC/DM navigation; set it to "false" to
       restore that chrome together with PLAYER_ONLY_PUBLISH. -->
  <gl-shell data-player-only="true"></gl-shell>

  <div class="main-wrap">
    <div class="container">

      <!-- Home: the slab hero + forge (app/slab/forge.slab → <gl-forge>).
           The component owns the headline, the flavour chips, the three
           pickers and the generate action; the page owes it a width. -->
      <section id="view-home" class="main-content">
        <div id="forge-host" class="forge-host">
          <gl-forge></gl-forge>
        </div>
      </section>

      <!-- Character Sheet: the slab reforge bar plus the generated sheet
           HTML, which app.js drops into #character_result. -->
      <section id="view-sheet" hidden>
        <gl-sheet></gl-sheet>
        <div id="character_result"></div>
      </section>

    </div>
  </div>

  <!-- Page chrome in slab: footer (app/slab/footer.slab → <gl-footer>). -->
  <gl-footer></gl-footer>

  <script src="/static/js/summon-loader.js"></script>
  <script src="/static/js/eldritch.js"></script>
  <script type="module" src="/static/js/app.js?v=5"></script>
</body>
</html>
